<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OmniFind Account</title><link rel="stylesheet" href="styles.css"><style>
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#203f66,transparent 55%),var(--bg,#0c1220)}.auth-card{width:min(460px,100%);padding:30px;border:1px solid #ffffff20;border-radius:22px;background:var(--card,#151e2f);box-shadow:0 20px 80px #0004}.auth-card h1{margin:8px 0}.auth-card p{color:var(--muted,#9aa8bd);line-height:1.5}.auth-tabs{display:flex;gap:8px;margin:22px 0}.auth-tabs button{flex:1;padding:11px;border-radius:10px;border:1px solid #ffffff24;background:transparent;color:inherit;cursor:pointer}.auth-tabs button.active{background:#536dfe;color:white}.auth-form{display:grid;gap:13px}.auth-form label{display:grid;gap:6px;font-size:14px}.auth-form input{padding:13px;border-radius:10px;border:1px solid #ffffff28;background:#0d1422;color:white}.auth-submit{padding:13px;border:0;border-radius:10px;background:#6478ff;color:white;font-weight:700;cursor:pointer}.auth-note{font-size:13px;min-height:20px}.auth-links{display:flex;justify-content:space-between;gap:12px;margin-top:14px}.auth-links button{background:none;border:0;color:#9eafff;cursor:pointer}.hidden{display:none!important}
</style></head><body><main class="auth-wrap"><section class="auth-card"><div class="brand"><span class="brand-mark">✦</span><span class="brand-name">OmniFind <span class="brand-tech">ACCOUNT</span></span></div><h1 id="authTitle">Welcome back</h1><p id="authIntro">Sign in to search, save results and ingest files.</p><div class="auth-tabs"><button id="loginTab" class="active" type="button">Log in</button><button id="registerTab" type="button">Register</button></div><form id="authForm" class="auth-form"><label>Email address<input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label id="passwordLabel">Password<input id="password" type="password" autocomplete="current-password" required minlength="10" placeholder="At least 10 characters"></label><div id="resetFields" class="hidden"><label>New password<input id="newPassword" type="password" minlength="10" placeholder="At least 10 characters and one number"></label></div><button class="auth-submit" id="submitBtn" type="submit">Log in</button></form><div class="auth-links"><button id="forgotBtn" type="button">Forgot password?</button><button id="backLoginBtn" class="hidden" type="button">Back to login</button></div><p id="authMessage" class="auth-note" role="status"></p><p style="font-size:12px">Use an email address you control. Email verification and password reset links require SMTP settings on the server.</p></section></main><script>
(()=>{const $=id=>document.getElementById(id);let mode=new URLSearchParams(location.search).has('token')?'reset':'login';const token=new URLSearchParams(location.search).get('token');function setMode(m){mode=m;['loginTab','registerTab'].forEach(id=>$(id).classList.toggle('active',(id==='loginTab'&&m==='login')||(id==='registerTab'&&m==='register')));$('authTitle').textContent=m==='register'?'Create your account':m==='forgot'?'Reset your password':m==='reset'?'Choose a new password':'Welcome back';$('authIntro').textContent=m==='register'?'Register with your email to use OmniFind.':m==='forgot'?'We will email a reset link if the account exists.':m==='reset'?'Choose a new password for your account.':'Sign in to search, save results and ingest files.';$('passwordLabel').classList.toggle('hidden',m==='forgot'||m==='reset');$('resetFields').classList.toggle('hidden',m!=='reset');$('email').classList.toggle('hidden',m==='reset');$('submitBtn').textContent={login:'Log in',register:'Create account',forgot:'Send reset link',reset:'Save new password'}[m];$('forgotBtn').classList.toggle('hidden',m!=='login');$('backLoginBtn').classList.toggle('hidden',m==='login');$('loginTab').classList.toggle('hidden',m==='forgot'||m==='reset');$('registerTab').classList.toggle('hidden',m==='forgot'||m==='reset');$('password').required=m==='login'||m==='register';$('newPassword').required=m==='reset';$('email').required=m!=='reset';$('authMessage').textContent='';} $('loginTab').onclick=()=>setMode('login');$('registerTab').onclick=()=>setMode('register');$('forgotBtn').onclick=()=>setMode('forgot');$('backLoginBtn').onclick=()=>{history.replaceState({},'', '/login');setMode('login')};$('authForm').onsubmit=async e=>{e.preventDefault();const message=$('authMessage');message.textContent='Please wait…';let endpoint,body={email:$('email').value.trim(),password:$('password').value};if(mode==='login')endpoint='/api/auth/login';if(mode==='register')endpoint='/api/auth/register';if(mode==='forgot'){endpoint='/api/auth/forgot';body={email:$('email').value.trim()}}if(mode==='reset'){endpoint='/api/auth/reset';body={token,password:$('newPassword').value}}try{const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');message.textContent=d.message||'Success';if(mode==='login'){location.href='/';return}if(mode==='reset'){history.replaceState({},'', '/login');setMode('login')}else if(mode==='register'&&!d.email_delivery_configured){message.textContent=d.message+' For local testing, you can log in now; production should configure SMTP.'; }else if(mode==='register'){setMode('login');message.textContent=d.message}else if(mode==='forgot'){message.textContent=d.message}}catch(err){message.textContent=err.message}};setMode(mode)})();
</script></body></html>
